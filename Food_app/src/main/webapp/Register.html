<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodExpress - Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f8f8f8;
}

/* NAVBAR */

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 50px;
    background:#e23744;
    color:white;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    text-decoration:none;
    color:white;
    font-size:17px;
    font-weight:bold;
    transition:0.3s;
}

.nav-links a:hover{
    color:#ffd700;
}

/* HERO SECTION */

.hero{
    height:250px;
    background:linear-gradient(rgba(0,0,0,.5),
    rgba(0,0,0,.5)),
    url('https://images.unsplash.com/photo-1504674900247-0877df9cc836');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

.hero h1{
    font-size:42px;
}

/* REGISTRATION FORM */

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px 20px;
}

.register-card{
    background:white;
    width:450px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.register-card h2{
    text-align:center;
    color:#e23744;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.form-group textarea{
    resize:none;
    height:90px;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#e23744;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#c91d2c;
}

.login-link{
    text-align:center;
    margin-top:15px;
}

.login-link a{
    text-decoration:none;
    color:#e23744;
    font-weight:bold;
}

/* FOOTER */

footer{
    text-align:center;
    padding:20px;
    background:#222;
    color:white;
    margin-top:20px;
}

/* MOBILE */

@media(max-width:768px){

    .navbar{
        flex-direction:column;
        gap:10px;
    }

    .hero h1{
        font-size:28px;
    }

    .register-card{
        width:100%;
    }
}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">FoodExpress</div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Restaurants</a>
        <a href="#">Login</a>
        <a href="#">Sign Up</a>
    </div>

</nav>

<!-- HERO SECTION -->

<section class="hero">
    <h1>Create Your Account</h1>
</section>

<!-- REGISTRATION FORM -->

<div class="container">

    <div class="register-card">

        <h2>Registration Form</h2>

        <form action="callRegisterServlet" method="post">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea name="address" placeholder="Enter your address" required></textarea>
            </div>

            <div class="form-group">
                <label>Role</label>
                <select name="role" required>
                    <option value="">Select Role</option>
                    <option value="Customer">Customer</option>
                    <option value="Admin">Admin</option>
                    <option value="RestaurantOwner">Restaurant Owner</option>
                </select>
            </div>

            <button type="submit" class="btn">
                Register
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="#">Login Here</a>
        </div>

    </div>

</div>

<!-- FOOTER -->

<footer>
    <p>© 2026 FoodExpress. All Rights Reserved.</p>
</footer>

</body>
</html>
