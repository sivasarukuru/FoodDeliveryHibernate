```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodExpress Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(rgba(0,0,0,.5),
    rgba(0,0,0,.5)),
    url('https://images.unsplash.com/photo-1504674900247-0877df9cc836');
    background-size:cover;
    background-position:center;
}

/* Navbar */

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 50px;
    background:#e23744;
    color:white;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    text-decoration:none;
    color:white;
    font-weight:bold;
}

.nav-links a:hover{
    color:#ffd700;
}

/* Login Section */

.login-section{
    display:flex;
    justify-content:center;
    align-items:center;
    height:85vh;
}

.login-card{
    width:400px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.login-card h2{
    text-align:center;
    color:#e23744;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-group input:focus{
    outline:none;
    border-color:#e23744;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    background:#e23744;
    color:white;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    background:#c91d2c;
}

.extra-links{
    text-align:center;
    margin-top:15px;
}

.extra-links a{
    text-decoration:none;
    color:#e23744;
    font-weight:bold;
}

.extra-links a:hover{
    text-decoration:underline;
}

footer{
    text-align:center;
    padding:15px;
    background:#222;
    color:white;
}

/* Mobile */

@media(max-width:768px){

.navbar{
    flex-direction:column;
    gap:10px;
}

.login-card{
    width:90%;
}

}

</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">FoodExpress</div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Restaurants</a>
        <a href="#">Login</a>
        <a href="#">Sign Up</a>
    </div>
</nav>

<section class="login-section">

    <div class="login-card">

        <h2>Login to FoodExpress</h2>

        <form action="callLoginServlet" method="post">

            <div class="input-group">
                <label>Email Address</label>
                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password"
                       name="password"
                       placeholder="Enter your password"
                       required>
            </div>

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <div class="extra-links">
            <p>Don't have an account?</p>
            <a href="Register.html">Create Account</a>
        </div>

    </div>

</section>

<footer>
    © 2026 FoodExpress | Fast Delivery, Great Taste
</footer>

</body>
</html>
```
